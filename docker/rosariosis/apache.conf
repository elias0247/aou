ServerName sis.aou.test
<VirtualHost *:8081>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Volume contents cannot disable the rule that uploaded code must not execute.
    <DirectoryMatch "/var/www/html/assets/(FileUploads|StudentPhotos|UserPhotos)">
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|html?|xml|svg|js)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    <FilesMatch "^(config\.inc\.(sample\.)?php|diagnostic\.php)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
</IfModule>
